<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Show Me The Money - Menu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      width: 280px;
      background: transparent;
    }

    #menu-container {
      width: 100%;
    }

    .menu-section {
      display: flex;
      flex-direction: column;
    }

    .section-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .section-title {
      flex: 1;
      font-weight: 500;
      cursor: default;
    }

    .section-title.clickable {
      cursor: pointer;
      user-select: none;
    }

    .icon-button {
      width: 24px;
      height: 24px;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .icon-button:hover {
      opacity: 0.8;
    }

    .icon-button svg {
      width: 100%;
      height: 100%;
      transition: transform 0.2s ease;
    }

    .icon-button.expanded svg {
      transform: rotate(180deg);
    }

    .expand-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.2s ease;
    }

    .expand-content.open {
      max-height: 500px;
    }

    .expand-inner {
      display: flex;
      flex-direction: column;
    }

    .expand-paragraph {
      display: block;
    }

    .button-group {
      display: flex;
      gap: 4px;
    }

    .menu-button {
      flex: 1;
      font-size: 12px;
      font-weight: 500;
      color: #FFFFFF;
      background: #272B32;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .menu-button:hover {
      opacity: 0.8;
    }

    .menu-button.primary {
      background: #4A90E2;
    }

    .toggle-group {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .toggle-button {
      flex: 1;
      font-size: 12px;
      font-weight: 500;
      color: #FFFFFF;
      background: #272B32;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      opacity: 0.6;
    }

    .toggle-button.active {
      opacity: 1;
      background: #4A90E2;
    }

    .toggle-button:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="menu-container">
    <!-- Menu sections will be dynamically generated here -->
  </div>

  <script src="menu.js"></script>
</body>
</html>
